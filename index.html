<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado Biologia: Vírus e Bactérias - 2º Ano</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            color: #333; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* TELA DE LOGIN */
        .login-container {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .login-container h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .login-container p {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.05em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d8e0;
            border-radius: 6px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .btn-iniciar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-iniciar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-iniciar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.95em;
            margin-top: 10px;
            display: none;
        }

        /* TELA DO SIMULADO */
        .quiz-wrapper {
            display: none;
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 0;
            overflow: visible;
            box-shadow: none;
        }

        .quiz-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .quiz-header h1 {
            margin-bottom: 5px;
            font-size: 2em;
        }

        .quiz-header p {
            margin-bottom: 10px;
            font-size: 1.05em;
            opacity: 0.95;
        }

        .student-info {
            background: rgba(255,255,255,0.15);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.95em;
            display: inline-block;
            margin-top: 10px;
        }

        .quiz-container {
            padding: 40px;
            padding-top: 180px;
            max-height: 100vh;
            overflow-y: auto;
            margin-top: 0;
        }



        .question {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #f0f2f5;
        }

        .question:last-child {
            border-bottom: none;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.15em;
            margin-bottom: 15px;
            display: block;
            color: #2c3e50;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-right: 5px;
        }

        .options {
            list-style: none;
            padding: 0;
        }

        .options li {
            margin-bottom: 10px;
            padding: 12px 15px;
            border: 2px solid #d1d8e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }

        .options li:hover {
            background-color: #f1f2f6;
            border-color: #667eea;
        }

        .options li.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }

        .incorrect {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        .rationale {
            margin-top: 15px;
            display: none;
            padding: 15px;
            border-left: 5px solid #667eea;
            background: #eef7fe;
            border-radius: 4px;
            font-size: 0.95em;
        }

        /* TELA DE RESULTADO */
        .result-container {
            display: none;
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .result-header {
            margin-bottom: 30px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            font-size: 3em;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .score-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 5px;
        }

        .result-title {
            font-size: 2em;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .result-message {
            font-size: 1.15em;
            color: #555;
            line-height: 1.8;
            margin-bottom: 40px;
            padding: 20px;
            background: #f0f2f5;
            border-radius: 8px;
            border-left: 5px solid #667eea;
        }

        .result-details {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.05em;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            color: #666;
            font-weight: 600;
        }

        .detail-value {
            color: #2c3e50;
            font-weight: bold;
        }

        .btn-restart {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-finish-quiz {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        .btn-finish-quiz:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .login-container {
                padding: 30px;
            }

            .quiz-container {
                padding: 20px;
                max-height: 60vh;
            }

            .result-container {
                padding: 30px;
            }

            .score-circle {
                width: 120px;
                height: 120px;
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div class="login-container" id="loginScreen">
    <h1>📋 Simulado</h1>
    <p>Vírus e Bactérias - 2º Ano</p>
    
    <form id="loginForm" onsubmit="iniciarSimulado(event)">
        <div class="form-group">
            <label for="studentName">Nome do Aluno(a) *</label>
            <input type="text" id="studentName" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="studentClass">Turma *</label>
            <input type="text" id="studentClass" placeholder="Ex: 2º A, 2º B, etc." required>
        </div>

        <button type="submit" class="btn-iniciar">Iniciar Simulado</button>
        <div class="error-message" id="errorMessage"></div>
    </form>
</div>

<!-- TELA DO SIMULADO -->
<div class="quiz-wrapper" id="quizScreen">
    <div class="quiz-header">
        <h1>Simulado: Vírus e Bactérias</h1>
        <p>Ciências da Natureza - 2º Ano Ensino Médio</p>
        <div class="student-info">
            👤 <span id="displayName"></span> | 🏫 <span id="displayClass"></span>
        </div>
    </div>



    <div class="quiz-container">
        <div id="quiz-content"></div>
        <button class="btn-finish-quiz" onclick="finalizarSimulado()">Finalizar Simulado</button>
    </div>
</div>

<!-- TELA DE RESULTADO -->
<div class="result-container" id="resultScreen">
    <div class="result-header">
        <div class="score-circle" id="scoreCircle">0/20</div>
        <h2 class="result-title" id="resultTitle">Resultado</h2>
        <div class="result-message" id="resultMessage"></div>
    </div>

    <div class="result-details">
        <div class="detail-row">
            <span class="detail-label">Nome:</span>
            <span class="detail-value" id="resultName"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Turma:</span>
            <span class="detail-value" id="resultClass"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Acertos:</span>
            <span class="detail-value" id="resultCorrect"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Erros:</span>
            <span class="detail-value" id="resultWrong"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Percentual:</span>
            <span class="detail-value" id="resultPercentage"></span>
        </div>
    </div>

    <button class="btn-restart" onclick="reiniciarSimulado()">Fazer Simulado Novamente</button>
</div>

<script>
    const questions = [
        { q: "Por que antibióticos não possuem eficácia contra doenças causadas por vírus?", options: ["Possuem membranas plasmáticas mais resistentes.", "Vírus são acelulares e não possuem metabolismo próprio.", "O material genético viral é composto exclusivamente por RNA.", "Vírus são eucariontes simplificados."], correct: 1, why: "Antibióticos atacam processos metabólicos bacterianos. Vírus dependem da célula hospedeira." },
        { q: "O mecanismo biológico pelo qual a vacina protege o indivíduo baseia-se na:", options: ["Produção imediata de toxinas neutralizantes.", "Estimulação para formação de células de memória e anticorpos.", "Destruição direta dos capsídeos virais.", "Alteração do DNA das células humanas."], correct: 1, why: "A vacina é uma imunização ativa que treina o sistema imunológico." },
        { q: "A leptospirose, comum após enchentes, é causada por:", options: ["Um vírus do mosquito Aedes aegypti.", "Uma bactéria na urina de ratos que penetra na pele.", "Um fungo de ambientes úmidos.", "Um protozoário de alimentos crus."], correct: 1, why: "A bactéria Leptospira é transmitida pelo contato com água contaminada por urina de roedores." },
        { q: "A absorção de fragmentos de DNA do meio ambiente por uma bactéria é chamada de:", options: ["Transdução", "Conjugação", "Transformação", "Bipartição"], correct: 2, why: "Transformação é a captação de DNA livre; Conjugação exige contato direto e Transdução usa vírus." },
        { q: "Sobre a tuberculose, destaca-se que:", options: ["É prevenida apenas por máscaras.", "O agente é o Mycobacterium tuberculosis e a vacina é a BCG.", "Não se usa antibióticos no tratamento.", "É uma virose de transmissão hídrica."], correct: 1, why: "A BCG é a vacina fundamental para prevenir formas graves dessa bactéria." },
        { q: "Um patógeno com apenas um tipo de ácido nucleico e sem ribossomos é um:", options: ["Fungo", "Protozoário", "Vírus", "Arqueia"], correct: 2, why: "Vírus não possuem ribossomos nem metabolismo, sendo acelulares." },
        { q: "No ciclo lisogênico de um vírus, ocorre:", options: ["Destruição imediata da célula.", "Integração do DNA viral ao DNA da bactéria (latência).", "Produção de capsídeos antes do DNA.", "Transformação da bactéria em eucarionte."], correct: 1, why: "No ciclo lisogênico, o vírus permanece 'escondido' sem matar a célula imediatamente." },
        { q: "A resistência bacteriana (superbactérias) é causada principalmente por:", options: ["Mutação induzida pelo remédio.", "Uso indiscriminado de antibióticos que seleciona as resistentes.", "Transformação de bactérias em vírus.", "Higiene excessiva que mata o sistema imune."], correct: 1, why: "O antibiótico atua como agente seletivo, não como causador da mutação." },
        { q: "Dengue e Sífilis são causadas, respectivamente, por:", options: ["Bactéria e Vírus.", "Vírus e Bactéria.", "Protozoário e Vírus.", "Vírus e Protozoário."], correct: 1, why: "Dengue é viral (arbovirose) e Sífilis é bacteriana (IST)." },
        { q: "A parede celular bacteriana serve para:", options: ["Controlar a entrada de nutrientes.", "Conferir forma e proteção contra pressão osmótica.", "Sintetizar proteínas virais.", "Armazenar plasmídeos."], correct: 1, why: "A rigidez da parede de peptidoglicano mantém a integridade física da bactéria." },
        { q: "Vírus são chamados de parasitas intracelulares obrigatórios porque:", options: ["Vivem em harmonia com a célula.", "Dependem da maquinaria da célula para se replicar.", "Degradam matéria orgânica morta.", "São procariontes."], correct: 1, why: "Sem uma célula hospedeira, o vírus é apenas uma partícula inerte (virion)." },
        { q: "O HIV é combatido com antirretrovirais que focam em:", options: ["Matar a bactéria oportunista.", "Inibir enzimas como a transcriptase reversa.", "Curar a AIDS com uma única dose.", "Substituir o DNA humano por viral."], correct: 1, why: "Drogas antirretrovirais impedem que o vírus converta seu RNA em DNA." },
        { q: "Por que a vacina da gripe deve ser anual?", options: ["Porque as bactérias ficam resistentes.", "Devido às mutações constantes nas proteínas do vírus.", "Porque o vírus vira uma célula.", "Porque antibióticos param de funcionar."], correct: 1, why: "Mutações mudam a 'aparência' do vírus para o sistema imune, exigindo novas vacinas." },
        { q: "Estruturas circulares de DNA extra que levam genes de resistência são:", options: ["Ribossomos", "Plasmídeos", "Mesossomos", "Cápsulas"], correct: 1, why: "Plasmídeos são fundamentais na transferência horizontal de genes de resistência." },
        { q: "A Febre Maculosa é causada por:", options: ["Um vírus respiratório.", "Uma bactéria transmitida por carrapatos.", "Vermes intestinais.", "Picada de mosquito Aedes."], correct: 1, why: "A bactéria Rickettsia rickettsii é transmitida pelo carrapato-estrela." },
        { q: "Penicilinas são seguras para humanos porque atacam a parede celular, e:", options: ["Humanos absorvem o remédio como energia.", "Células humanas não possuem parede celular.", "Atacam apenas o núcleo celular.", "O fígado as neutraliza na hora."], correct: 1, why: "A toxicidade seletiva foca em estruturas que nós não temos (como a parede de peptidoglicano)." },
        { q: "A enzima transcriptase reversa é característica de:", options: ["Bactérias", "Retrovírus (como HIV)", "Fungos", "Bacteriófagos de DNA"], correct: 1, why: "Ela permite que o RNA viral dite a formação de DNA, invertendo o fluxo normal." },
        { q: "Sabão e álcool funcionam contra vírus envelopados pois:", options: ["Quebram o DNA.", "Dissolvem o envelope lipídico (gordura).", "Causam mutações.", "Impedem a bactéria de respirar."], correct: 1, why: "O envelope viral é feito de gordura, que é dissolvida por detergentes e álcool." },
        { q: "O botulismo ocorre em latas de conserva porque a bactéria é:", options: ["Aeróbia obrigatória.", "Anaeróbia e forma esporos resistentes.", "Um vírus gigante.", "Transmitida por insetos."], correct: 1, why: "Ambientes sem oxigênio e fechados favorecem o crescimento e a liberação de toxinas da C. botulinum." },
        { q: "Aumento de leucócitos no hemograma geralmente indica:", options: ["Desidratação.", "Resposta a uma infecção (vírus ou bactéria).", "Falta de ferro.", "Radiação UV."], correct: 1, why: "Leucócitos são células de defesa que se multiplicam para combater patógenos." }
    ];

    let studentName = '';
    let studentClass = '';
    let correctAnswers = 0;
    let currentQuestion = 0;
    let answered = {};

    function iniciarSimulado(event) {
        event.preventDefault();
        
        const name = document.getElementById('studentName').value.trim();
        const classRoom = document.getElementById('studentClass').value.trim();

        if (!name || !classRoom) {
            document.getElementById('errorMessage').textContent = 'Por favor, preencha todos os campos!';
            document.getElementById('errorMessage').style.display = 'block';
            return;
        }

        studentName = name;
        studentClass = classRoom;
        correctAnswers = 0;
        answered = {};

        document.getElementById('displayName').textContent = studentName;
        document.getElementById('displayClass').textContent = studentClass;

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('quizScreen').style.display = 'block';

        renderQuestions();
    }

    function renderQuestions() {
        const content = document.getElementById('quiz-content');
        content.innerHTML = '';

        questions.forEach((item, index) => {
            let qDiv = document.createElement('div');
            qDiv.className = 'question';
            
            let optionsHtml = item.options.map((opt, i) => 
                `<li onclick="check(this, ${i === item.correct}, ${index})">${opt}</li>`
            ).join('');

            qDiv.innerHTML = `
                <span class="question-text"><span class="question-number">${index + 1}.</span> ${item.q}</span>
                <ul class="options" id="options-${index}">${optionsHtml}</ul>
                <div id="r${index}" class="rationale"><strong>Explicação:</strong> ${item.why}</div>
            `;
            content.appendChild(qDiv);
        });
    }

    function check(el, isCorrect, questionIndex) {
        if (answered[questionIndex]) return;

        const parent = el.parentElement;
        const options = parent.querySelectorAll('li');
        
        options.forEach(opt => {
            opt.classList.add('disabled');
            opt.style.pointerEvents = 'none';
        });

        if (isCorrect) {
            el.classList.add('correct');
            correctAnswers++;
        } else {
            el.classList.add('incorrect');
            const correctIndex = questions[questionIndex].correct;
            options[correctIndex].classList.add('correct');
        }

        answered[questionIndex] = true;
        document.getElementById('r' + questionIndex).style.display = 'block';

    }



    function finalizarSimulado() {
        const answeredCount = Object.keys(answered).length;
        
        if (answeredCount < questions.length) {
            alert('Por favor, responda todas as questões antes de finalizar!');
            return;
        }

        mostrarResultado();
    }

    function mostrarResultado() {
        const wrongAnswers = questions.length - correctAnswers;
        const percentage = Math.round((correctAnswers / questions.length) * 100);

        let title = '';
        let message = '';

        if (correctAnswers >= 17) {
            title = '🎉 Excelente!';
            message = 'Você sabe tudo de vírus e bactérias! Parabéns pelo desempenho excepcional!';
        } else if (correctAnswers >= 15) {
            title = '👏 Muito Bom!';
            message = 'Muito bom mesmo, você está no caminho certo! Continue estudando para melhorar ainda mais!';
        } else if (correctAnswers >= 10) {
            title = '✅ Bom!';
            message = 'Tá bom, mas você tem a capacidade de se sair melhor. Acredito em você! Revise os conteúdos e tente novamente.';
        } else {
            title = '📚 Vamos Melhorar!';
            message = 'Podemos melhorar esse índice hein! Tá com dúvida em qual parte? Revise o conteúdo e faça o simulado novamente!';
        }

        document.getElementById('scoreCircle').textContent = `${correctAnswers}/20`;
        document.getElementById('resultTitle').textContent = title;
        document.getElementById('resultMessage').textContent = message;
        document.getElementById('resultName').textContent = studentName;
        document.getElementById('resultClass').textContent = studentClass;
        document.getElementById('resultCorrect').textContent = correctAnswers;
        document.getElementById('resultWrong').textContent = wrongAnswers;
        document.getElementById('resultPercentage').textContent = percentage + '%';

        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
    }

    function reiniciarSimulado() {
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('studentName').value = '';
        document.getElementById('studentClass').value = '';
        document.getElementById('errorMessage').style.display = 'none';
    }
</script>

</body>
</html>
